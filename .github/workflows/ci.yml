name: Component acceptance
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.18.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run bench
      - run: |
          npm pack
          tar -tzf superche-persistent-repl-0.1.0.tgz | grep "package/npm-shrinkwrap.json"
      - uses: actions/upload-artifact@v4
        with:
          name: package-node-${{ matrix.node }}
          path: '*.tgz'
