name: Standalone component acceptance
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.18.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Source, contracts, benchmark and independent distributions
        run: npm run accept
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-node-${{ matrix.node }}
          path: |
            artifacts/0.2.0/
            artifacts/acceptance.json
            artifacts/benchmark.json
            artifacts/package-verification.json
            artifacts/*.log
            artifacts/package-verification/*.log
