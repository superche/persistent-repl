name: Component acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    strategy:
      matrix:
        node: ['22.19.0', '24.18.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run bench
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package-node-${{ matrix.node }}
          path: '*.tgz'
